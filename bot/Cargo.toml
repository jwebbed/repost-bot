[package]
name = "bot"
version = "0.5.2"
authors = ["Jonathan Webb <jonathan@webb.nyc>"]
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"

[dependencies]
db = { path = "../db" }
#db = { path = "../db", features = ["bundled"] }
chrono = "0.4"
url = "2"
linkify = "0.10.0"
regex = "1"
humantime = "2.1.0"
log = "0.4"
simple_logger = "5"
phf = { version = "0.11", features = ["macros"] }
unicode-segmentation = "1.7"
time = "0.3"
image = "0.24"
visual-hash = "3.0"
reqwest = "0.12"
serde_json = "1"
itertools = "0.14"
async-once-cell = "0.5.4"
rusqlite = "0.33"

[dependencies.rand]
version = "0.9"
default-features = false
features = ["std", "small_rng"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["client", "gateway", "rustls_backend", "model", "cache", "http", "chrono"]

[dependencies.tokio]
version = "1.17"
features = [ "rt", "time", "macros", "rt-multi-thread"] 
