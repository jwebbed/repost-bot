[package]
name = "bot"
version = "0.5.3"
authors = ["Jonathan Webb <jonathan@webb.nyc>"]
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[dependencies]
db = { path = "../db" }
#db = { path = "../db", features = ["bundled"] }
chrono = "0.4"
url = "2"
linkify = "0.11"
regex = "1"
log = "0.4"
simple_logger = "5"
phf = { version = "0.14", features = ["macros"] }
unicode-segmentation = "1.7"
time = "0.3"
image = "0.24"
visual-hash = "3.0"
reqwest = "0.13"
serde_json = "1"
itertools = "0.15"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = "0.40"

[dependencies.rand]
version = "0.10"
default-features = false
features = ["std"]

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["client", "gateway", "rustls_backend", "model", "cache", "http", "chrono"]

[dependencies.tokio]
version = "1.17"
features = [ "rt", "time", "macros", "rt-multi-thread"] 
